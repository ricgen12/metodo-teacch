    <script>
        // DATOS COMUNES PARA TODOS LOS MÓDULOS
        const courseModules = {
            module1: {
                title: "Módulo 1: ¿Qué es el método TEACCH y sus objetivos?",
                duration: "15 minutos",
                file: "modulo1.html",
                next: "module2",
                prev: null
            },
            module2: {
                title: "Módulo 2: Beneficios del método TEACCH",
                duration: "10 minutos",
                file: "modulo2.html",
                next: "module3",
                prev: "module1"
            },
            module3: {
                title: "Módulo 3: Enseñanza estructurada: el corazón del TEACCH",
                duration: "15 minutos",
                file: "modulo3.html",
                next: "module4",
                prev: "module2"
            },
            module4: {
                title: "Módulo 4: Estructura física y sistema de trabajo",
                duration: "15 minutos",
                file: "modulo4.html",
                next: "module5",
                prev: "module3"
            },
            module5: {
                title: "Módulo 5: Horarios y organización del entorno",
                duration: "15 minutos",
                file: "modulo5.html",
                next: "module6",
                prev: "module4"
            },
            module6: {
                title: "Módulo 6: Aplicar e integrar el método TEACCH",
                duration: "20 minutos",
                file: "modulo6.html",
                next: null,
                prev: "module5"
            }
        };

        // DETECTAR MÓDULO ACTUAL
        function getCurrentModule() {
            const currentFile = window.location.pathname.split('/').pop();
            for (const [key, module] of Object.entries(courseModules)) {
                if (module.file === currentFile) {
                    return key;
                }
            }
            return 'module1'; // Por defecto
        }

        // CONFIGURAR NAVEGACIÓN
        function setupNavigation() {
            const currentModule = getCurrentModule();
            const module = courseModules[currentModule];

            // Configurar título y datos del módulo
            document.getElementById('module-title').textContent = module.title;
            document.getElementById('module-duration').textContent = `Duración: ${module.duration}`;

            // Configurar botones de navegación
            const prevButtons = document.querySelectorAll('#prev-module, #prev-module-bottom');
            const nextButtons = document.querySelectorAll('#next-module, #next-module-bottom');
            const homeButtons = document.querySelectorAll('#home-button, #home-button-bottom');

            // Botón anterior
            prevButtons.forEach(btn => {
                if (module.prev) {
                    btn.onclick = () => window.location.href = courseModules[module.prev].file;
                } else {
                    btn.disabled = true;
                    btn.style.background = '#ccc';
                }
            });

            // Botón siguiente
            nextButtons.forEach(btn => {
                if (module.next) {
                    btn.onclick = () => window.location.href = courseModules[module.next].file;
                } else {
                    btn.disabled = true;
                    btn.style.background = '#ccc';
                }
            });

            // Botón inicio
            homeButtons.forEach(btn => {
                btn.onclick = () => window.location.href = 'index.html';
            });
        }

        // INICIALIZAR AL CARGAR LA PÁGINA
        document.addEventListener('DOMContentLoaded', function() {
            setupNavigation();
            console.log(`Módulo ${getCurrentModule()} cargado correctamente`);
        });

            // Para actividades de relacionar columnas
            setupMatchingActivity: function(leftItems, rightItems) {
                // Lógica genérica para matching
            }
        };
    </script>
